# Workflow lints, and checks format in parallel then runs tests on all platforms. Afterwards the
# Windows installer, the macOS app and the Arch Linux package are built. Pushing a tag "vX.Y.Z"
# additionally publishes these packages as a GitHub release. The release title has to be the bare
# version number, the update check in core/util.py parses it.

name: Default CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' core/__init__.py)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match __version__ ${version} in core/__init__.py"
            exit 1
          fi
      - uses: pre-commit/action@v3.0.1
  test:
    needs: [pre-commit]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies and build python modules
        run: |
          python -m pip install --upgrade pip
          # PySide6 is only a dependency outside of Linux, the UI tests need it everywhere
          pip install -e ".[dev]" PySide6
      - name: Build Qt resources
        run: pyside6-rcc qt/dg.qrc -o qt/dg_rc.py
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest core hscommon qt
  package-arch:
    needs: [test]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git python python-setuptools python-sphinx python-polib \
            pyside6 python-send2trash python-mutagen python-semantic-version python-xxhash hicolor-icon-theme
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Build package
        run: |
          git config --system --add safe.directory '*'
          useradd -m builder
          chown -R builder: pkg/arch
          su builder -c "cd pkg/arch && DUPEGURU_REPO=git+file://${GITHUB_WORKSPACE} \
            DUPEGURU_REF=commit=${GITHUB_SHA} PKGDEST=${GITHUB_WORKSPACE}/pkg/arch/out makepkg --noconfirm"
      - name: Upload package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: package-arch
          path: pkg/arch/out/*.pkg.tar.zst
          if-no-files-found: error
  package-windows:
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
          choco install nsis -y --no-progress
      - name: Build
        run: python builder.py --clean
      - name: Package
        run: python package.py
      - name: Upload installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: package-windows
          path: dist/*.exe
          if-no-files-found: error
  package-macos:
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
      - name: Build
        run: python builder.py --clean
      - name: Package
        run: |
          python package.py
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' core/__init__.py)
          ditto -c -k --keepParent dist/dupeguru.app "dist/dupeGuru_macos_$(uname -m)_${version}.zip"
      - name: Upload app
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: package-macos
          path: dist/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-arch, package-windows, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME#v}" --generate-notes
